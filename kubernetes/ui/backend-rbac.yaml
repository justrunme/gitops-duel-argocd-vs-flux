apiVersion: v1
kind: ServiceAccount
metadata:
  name: ui-backend
  namespace: default
---
# Namespaced Roles (no cluster-wide ClusterRole) for allowlisted namespaces.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ui-backend-read
  namespace: argocd
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ui-backend-read
  namespace: argocd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ui-backend-read
subjects:
  - kind: ServiceAccount
    name: ui-backend
    namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ui-backend-read
  namespace: flux-system
rules:
  - apiGroups: ["kustomize.toolkit.fluxcd.io"]
    resources: ["kustomizations"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ui-backend-read
  namespace: flux-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ui-backend-read
subjects:
  - kind: ServiceAccount
    name: ui-backend
    namespace: default
---
