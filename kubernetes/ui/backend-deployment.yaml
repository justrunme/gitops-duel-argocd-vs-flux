apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui-backend
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ui-backend
  template:
    metadata:
      labels:
        app: ui-backend
    spec:
      serviceAccountName: ui-backend
      containers:
      - name: ui-backend
        image: justrunme/gitops-duel-ui-backend:ci-placeholder
        ports:
        - containerPort: 3001
        env:
        - name: NODE_ENV
          value: production
        - name: CORS_ORIGINS
          value: ""
        - name: ALLOWED_NAMESPACES
          value: "argocd,flux-system,argocd-demo,flux-demo,default"
        - name: RATE_LIMIT_MAX
          value: "60"
        - name: UI_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: ui-backend-api-token
              key: token
        readinessProbe:
          httpGet:
            path: /healthz
            port: 3001
          initialDelaySeconds: 2
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /healthz
            port: 3001
          initialDelaySeconds: 5
          periodSeconds: 10
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop: ["ALL"]
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
