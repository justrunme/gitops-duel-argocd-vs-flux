name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      # Create GitHub Release and upload SBOM/assets
      contents: write
      # OIDC for SBOM action provenance
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Extract changelog for tag
        id: changelog
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES="$(awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" {found=1; print; next}
            found && /^## \[/ {exit}
            found {print}
          ' CHANGELOG.md)"
          if [ -z "$NOTES" ]; then
            echo "No CHANGELOG section found for version ${VERSION}" >&2
            exit 1
          fi
          {
            echo "notes<<EOF"
            printf '%s\n' "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body: ${{ steps.changelog.outputs.notes }}
          files: docs/results.md
          fail_on_unmatched_files: true

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          artifact-name: gitops-duel-sbom.spdx.json
          output-file: gitops-duel-sbom.spdx.json
          upload-artifact: true
          upload-release-assets: false

      - name: Attach SBOM to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "${GITHUB_REF_NAME}" gitops-duel-sbom.spdx.json --clobber
