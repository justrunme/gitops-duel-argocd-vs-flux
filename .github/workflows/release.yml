name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Extract changelog for tag
        id: changelog
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES="$(awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" {found=1; print; next}
            found && /^## \[/ {exit}
            found {print}
          ' CHANGELOG.md)"
          if [ -z "$NOTES" ]; then
            echo "No CHANGELOG section found for version ${VERSION}" >&2
            exit 1
          fi
          {
            echo "notes<<EOF"
            printf '%s\n' "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3.0.3
        with:
          body: ${{ steps.changelog.outputs.notes }}
          files: docs/results.md
          fail_on_unmatched_files: true
