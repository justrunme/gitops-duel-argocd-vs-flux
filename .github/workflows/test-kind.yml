name: GitOps Duel CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  gitops-duel-ci:
    runs-on: ubuntu-latest
    env:
      TF_VAR_git_repository_url: https://github.com/justrunme/gitops-duel-argocd-vs-flux.git
      TF_VAR_git_branch: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
      TF_VAR_argocd_target_namespace: argocd-demo
      TF_VAR_flux_target_namespace: flux-demo
      ARGO_TARGET_NAMESPACE: argocd-demo
      FLUX_TARGET_NAMESPACE: flux-demo
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup KinD
        uses: helm/kind-action@v1.15.1
        with:
          cluster_name: kind

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: Install Flux CLI
        run: |
          curl -s https://fluxcd.io/install.sh | sudo bash
          flux --version

      - name: Install ArgoCD CLI
        run: |
          curl -sSL -o argocd https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
          chmod +x argocd
          sudo mv argocd /usr/local/bin/

      - name: Show GitOps source revision
        run: |
          echo "Tracking repo=${TF_VAR_git_repository_url} branch=${TF_VAR_git_branch}"

      - name: Terraform Init
        working-directory: .
        run: terraform init

      - name: Terraform Apply - Core Components (ArgoCD & Flux)
        working-directory: .
        run: |
          terraform apply -target=module.argocd.kubernetes_namespace.argocd -auto-approve
          terraform apply -target=module.argocd.helm_release.argocd -auto-approve
          echo "Waiting for ArgoCD CRDs to be ready..."
          kubectl wait --for=condition=Established crd/applications.argoproj.io --timeout=120s
          terraform apply -target=module.argocd.kubernetes_namespace.target -auto-approve
          terraform apply -target=module.argocd.kubernetes_manifest.argocd_nginx_app -auto-approve
          terraform apply -target=module.argocd.kubernetes_manifest.argocd_helm_nginx_app -auto-approve
          terraform apply -auto-approve

      - name: Wait for ArgoCD server
        run: kubectl wait --for=condition=Available deployment/argocd-server -n argocd --timeout=360s

      - name: Verify ArgoCD
        run: |
          kubectl get all -n argocd
          kubectl wait --for=condition=ready pod -l app.kubernetes.io/name=argocd-server -n argocd --timeout=300s

      - name: Verify FluxCD
        run: |
          flux get all -A
          kubectl wait --for=condition=ready pod -l app=source-controller -n flux-system --timeout=300s

      - name: Run Performance Benchmarks
        id: benchmark
        run: |
          mkdir -p docs
          chmod +x .github/scripts/benchmark-gitops.sh .github/scripts/run-benchmark-demo.sh
          bash .github/scripts/run-benchmark-demo.sh
          python3 .github/scripts/write_demo_results.py
          cat docs/results.md >> "$GITHUB_STEP_SUMMARY"

          python3 - <<'PY'
          import json, re, sys
          data = json.load(open("docs/results.json"))
          mapping = {
              "Argo CD": ("argocd_ready", "argocd_heal", "argocd_rollback"),
              "Flux": ("flux_ready", "flux_heal", "flux_rollback"),
          }
          num = re.compile(r"\d+(?:\.\d+)?")
          outs = []
          for tool, keys in mapping.items():
              m = data["metrics"][tool]
              vals = [
                  m["time_to_ready_seconds"],
                  m["time_to_self_heal_seconds"],
                  m["time_to_rollback_seconds"],
              ]
              for idx, (k, v) in enumerate(zip(keys, vals)):
                  v = str(v).strip()
                  if not num.fullmatch(v):
                      print(f"Non-numeric benchmark value: {tool} {k}={v!r}", file=sys.stderr)
                      sys.exit(1)
                  if idx == 0 and float(v) <= 0:
                      print(f"time_to_ready must be > 0: {tool} {k}={v!r}", file=sys.stderr)
                      sys.exit(1)
                  outs.append(f"{k}={v}")
          Path = __import__("pathlib").Path
          Path("/tmp/bench_out.env").write_text("\n".join(outs) + "\n")
          print("\n".join(outs))
          PY
          cat /tmp/bench_out.env >> "$GITHUB_OUTPUT"

      - name: Build UI images for KinD
        run: |
          docker build -t justrunme/gitops-duel-ui-backend:latest ./ui-backend
          docker build -t justrunme/gitops-duel-ui-frontend:latest ./ui-frontend
          kind load docker-image justrunme/gitops-duel-ui-backend:latest --name kind
          kind load docker-image justrunme/gitops-duel-ui-frontend:latest --name kind

      - name: Deploy UI
        run: kubectl apply -f kubernetes/ui/

      - name: Debug ArgoCD deployed apps
        if: always()
        run: |
          echo "Deployments in argocd-demo:"
          kubectl get deployments -n argocd-demo || true
          echo "Deployments in flux-demo:"
          kubectl get deployments -n flux-demo || true
          echo "Argo CD applications:"
          kubectl get applications -A || true
          echo "Flux kustomizations:"
          kubectl get kustomizations -A || true

      - name: Simulate ArgoCD Deployment Issues
        run: |
          kubectl get deployment nginx-app -n argocd-demo
          kubectl delete deployment nginx-app -n argocd-demo --wait=true --timeout=60s
          # kubectl wait fails if the object is missing; poll until Argo recreates it
          for i in $(seq 1 60); do
            if kubectl get deployment nginx-app -n argocd-demo >/dev/null 2>&1; then
              if kubectl wait --for=condition=available deployment/nginx-app -n argocd-demo --timeout=30s; then
                echo "Argo CD restored deployment"
                exit 0
              fi
            fi
            sleep 5
          done
          echo "Argo CD did not restore deployment in time"
          kubectl get application nginx-app -n argocd -o yaml || true
          exit 1

      - name: Simulate Flux Deployment Issues
        run: |
          kubectl get deployment nginx-app -n flux-demo
          kubectl scale deployment nginx-app --replicas=0 -n flux-demo
          for i in $(seq 1 60); do
            cur=$(kubectl get deployment nginx-app -n flux-demo -o jsonpath='{.spec.replicas}' 2>/dev/null || echo 0)
            ready=$(kubectl get deployment nginx-app -n flux-demo -o jsonpath='{.status.readyReplicas}' 2>/dev/null || echo 0)
            if [ "$cur" = "1" ] && [ "$ready" = "1" ]; then
              echo "Flux restored deployment"
              exit 0
            fi
            sleep 5
          done
          echo "Flux did not restore deployment in time"
          kubectl get kustomization flux-nginx-app -n flux-system -o yaml || true
          exit 1

      - name: Get Access Information
        id: access_info
        run: |
          if kubectl get secret argocd-initial-admin-secret -n argocd &>/dev/null; then
            ARGOCD_PASSWORD=$(kubectl -n argocd get secret argocd-initial-admin-secret -o jsonpath="{.data.password}" | base64 -d)
            echo "ARGOCD_PASSWORD=${ARGOCD_PASSWORD}" >> "$GITHUB_OUTPUT"
          else
            echo "ARGOCD_PASSWORD=admin" >> "$GITHUB_OUTPUT"
          fi

      - name: Output Access Information
        run: |
          echo ========================================
          echo "           Access Information           "
          echo ========================================
          echo
          echo "To access UI Dashboard:"
          echo "1. Run 'kubectl port-forward service/ui-frontend 8082:80 -n default'"
          echo "2. Open http://localhost:8082"
          echo
          echo "To access ArgoCD UI:"
          echo "1. Run 'kubectl port-forward svc/argocd-server -n argocd 8080:80'"
          echo "2. Open http://localhost:8080"
          echo "3. Login with username: admin"
          echo "   Password: ${ARGOCD_PASSWORD}"
        env:
          ARGOCD_PASSWORD: ${{ steps.access_info.outputs.ARGOCD_PASSWORD }}

      - name: Persist benchmark results
        if: always()
        run: |
          python3 .github/scripts/write_demo_results.py || true
          test -f docs/results.md && cat docs/results.md || true

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gitops-benchmark-results
          path: |
            docs/results.md
            docs/results.json
          if-no-files-found: warn
