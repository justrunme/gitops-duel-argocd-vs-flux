name: GitOps Duel CI

on:
  push:
    branches: [ main, "fix/**" ]
  pull_request:

jobs:
  ui-backend-unit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ui-backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui-backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Unit tests (malicious input rejection)
        run: npm test
        env:
          NODE_ENV: test
      - name: Guard against shell exec in request path
        run: |
          if grep -R --include='*.js' -nE "child_process|\\bexec\\(|execSync|execFile" app.js server.js lib/; then
            echo "shell/child_process usage is forbidden in ui-backend request path" >&2
            exit 1
          fi

  gitops-duel-ci:
    runs-on: ubuntu-latest
    needs: ui-backend-unit
    permissions:
      # write required for temporary ci/bench-* branches (commit→ready). Unit job stays read-only.
      contents: write
      actions: read
      checks: read
    env:
      TF_VAR_git_repository_url: https://github.com/justrunme/gitops-duel-argocd-vs-flux.git
      TF_VAR_git_branch: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
      TF_VAR_argocd_target_namespace: argocd-demo
      TF_VAR_flux_target_namespace: flux-demo
      ARGO_TARGET_NAMESPACE: argocd-demo
      FLUX_TARGET_NAMESPACE: flux-demo
      BENCHMARK_SAMPLES: "3"
      BENCHMARK_PROFILES: "equal-10s,defaults"
      BENCH_GIT_BRANCH: ci/bench-${{ github.run_id }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup KinD
        uses: helm/kind-action@v1.15.1
        with:
          cluster_name: kind

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: Install Flux CLI
        run: |
          curl -s https://fluxcd.io/install.sh | sudo bash
          flux --version

      - name: Install ArgoCD CLI
        run: |
          curl -sSL -o argocd https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
          chmod +x argocd
          sudo mv argocd /usr/local/bin/

      - name: Show GitOps source revision
        run: |
          echo "Tracking repo=${TF_VAR_git_repository_url} branch=${TF_VAR_git_branch}"

      - name: Terraform Init
        working-directory: .
        run: terraform init

      - name: Terraform Apply - Core Components (ArgoCD & Flux)
        working-directory: .
        run: |
          terraform apply -target=module.argocd.kubernetes_namespace.argocd -auto-approve
          terraform apply -target=module.argocd.helm_release.argocd -auto-approve
          echo "Waiting for ArgoCD CRDs to be ready..."
          kubectl wait --for=condition=Established crd/applications.argoproj.io --timeout=120s
          terraform apply -target=module.argocd.kubernetes_namespace.target -auto-approve
          terraform apply -target=module.argocd.kubernetes_manifest.argocd_nginx_app -auto-approve
          terraform apply -target=module.argocd.kubernetes_manifest.argocd_helm_nginx_app -auto-approve
          terraform apply -auto-approve

      - name: Wait for ArgoCD server
        run: kubectl wait --for=condition=Available deployment/argocd-server -n argocd --timeout=360s

      - name: Verify ArgoCD
        run: |
          kubectl get all -n argocd
          kubectl wait --for=condition=ready pod -l app.kubernetes.io/name=argocd-server -n argocd --timeout=300s

      - name: Verify FluxCD
        run: |
          flux get all -A
          kubectl wait --for=condition=ready pod -l app=source-controller -n flux-system --timeout=300s

      - name: Run Performance Benchmarks
        id: benchmark
        run: |
          mkdir -p docs
          chmod +x .github/scripts/benchmark-gitops.sh .github/scripts/run-benchmark-demo.sh .github/scripts/bench-local-git.sh
          bash .github/scripts/run-benchmark-demo.sh
          python3 .github/scripts/write_demo_results.py
          cat docs/results.md >> "$GITHUB_STEP_SUMMARY"

          python3 - <<'PY'
          import json, re, sys
          from pathlib import Path

          data = json.load(open("docs/results.json"))
          num = re.compile(r"\d+(?:\.\d+)?")
          profiles = data.get("profiles") or {}
          if "equal-10s" not in profiles or "defaults" not in profiles:
              print(f"missing required profiles, have={list(profiles)}", file=sys.stderr)
              sys.exit(1)
          if int(data.get("samples_per_metric", 0)) < 3:
              print("samples_per_metric must be >= 3", file=sys.stderr)
              sys.exit(1)

          required = [
              "time_to_ready_seconds",
              "time_to_self_heal_seconds",
              "time_to_deletion_recovery_seconds",
              "time_to_commit_ready_seconds",
          ]
          outs = []
          for profile, pdata in profiles.items():
              for tool, metrics in pdata.get("metrics", {}).items():
                  for key in required:
                      block = metrics.get(key)
                      if not isinstance(block, dict):
                          print(f"missing {profile}/{tool}/{key}", file=sys.stderr)
                          sys.exit(1)
                      for field in ("median", "min", "max"):
                          v = str(block.get(field, "")).strip()
                          if not num.fullmatch(v):
                              print(f"non-numeric {profile}/{tool}/{key}.{field}={v!r}", file=sys.stderr)
                              sys.exit(1)
                          if key in ("time_to_ready_seconds", "time_to_commit_ready_seconds") and float(v) <= 0:
                              print(f"{key} must be > 0: {profile}/{tool} {field}={v!r}", file=sys.stderr)
                              sys.exit(1)
                      samples = block.get("samples") or []
                      if len(samples) < 3:
                          print(f"N<3 for {profile}/{tool}/{key}: {samples!r}", file=sys.stderr)
                          sys.exit(1)
                  # Export primary-profile medians for step summary compatibility
                  if profile == data.get("primary_profile"):
                      prefix = "argocd" if tool == "Argo CD" else "flux"
                      outs.append(f"{prefix}_ready={metrics['time_to_ready_seconds']['median']}")
                      outs.append(f"{prefix}_heal={metrics['time_to_self_heal_seconds']['median']}")
                      outs.append(f"{prefix}_rollback={metrics['time_to_deletion_recovery_seconds']['median']}")
                      outs.append(f"{prefix}_commit={metrics['time_to_commit_ready_seconds']['median']}")

          Path("/tmp/bench_out.env").write_text("\n".join(outs) + "\n")
          print("\n".join(outs))
          PY
          cat /tmp/bench_out.env >> "$GITHUB_OUTPUT"

      - name: Build UI images for KinD
        id: ui_images
        run: |
          TAG="ci-${GITHUB_SHA::12}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          docker build -t "justrunme/gitops-duel-ui-backend:${TAG}" ./ui-backend
          docker build -t "justrunme/gitops-duel-ui-frontend:${TAG}" ./ui-frontend
          kind load docker-image "justrunme/gitops-duel-ui-backend:${TAG}" --name kind
          kind load docker-image "justrunme/gitops-duel-ui-frontend:${TAG}" --name kind

      - name: Deploy UI
        env:
          UI_IMAGE_TAG: ${{ steps.ui_images.outputs.tag }}
        run: |
          # Pin image tags (never :latest)
          sed -i "s|justrunme/gitops-duel-ui-backend:ci-placeholder|justrunme/gitops-duel-ui-backend:${UI_IMAGE_TAG}|g" kubernetes/ui/backend-deployment.yaml
          sed -i "s|justrunme/gitops-duel-ui-frontend:ci-placeholder|justrunme/gitops-duel-ui-frontend:${UI_IMAGE_TAG}|g" kubernetes/ui/frontend-deployment.yaml
          UI_API_TOKEN=$(openssl rand -hex 24)
          echo "::add-mask::${UI_API_TOKEN}"
          printf '%s' "${UI_API_TOKEN}" > /tmp/ui_api_token
          # Ensure demo namespaces exist before namespaced RoleBindings
          kubectl create namespace argocd-demo --dry-run=client -o yaml | kubectl apply -f -
          kubectl create namespace flux-demo --dry-run=client -o yaml | kubectl apply -f -
          # Apply UI manifests except the placeholder token Secret
          kubectl apply -f kubernetes/ui/backend-rbac.yaml
          kubectl apply -f kubernetes/ui/backend-deployment.yaml
          kubectl apply -f kubernetes/ui/backend-service.yaml
          kubectl apply -f kubernetes/ui/frontend-deployment.yaml
          kubectl apply -f kubernetes/ui/frontend-service.yaml
          kubectl apply -f kubernetes/ui/ingress.yaml
          # Real bearer token Secret last so placeholder YAML cannot overwrite it
          kubectl create secret generic ui-backend-api-token \
            --from-file=token=/tmp/ui_api_token \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n default rollout status deployment/ui-backend --timeout=180s
          kubectl -n default rollout status deployment/ui-frontend --timeout=180s

      - name: E2E UI backend health and auth
        run: |
          UI_API_TOKEN=$(cat /tmp/ui_api_token)
          kubectl -n default port-forward svc/ui-backend 3001:3001 >/tmp/ui-pf.log 2>&1 &
          PF_PID=$!
          cleanup() { kill "${PF_PID}" 2>/dev/null || true; }
          trap cleanup EXIT
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3001/healthz >/dev/null; then
              break
            fi
            sleep 1
          done
          # /healthz is public
          code=$(curl -s -o /tmp/healthz.json -w '%{http_code}' http://127.0.0.1:3001/healthz)
          test "${code}" = "200"
          grep -q '"status":"ok"' /tmp/healthz.json || grep -q '"status": "ok"' /tmp/healthz.json
          # API without token → 401
          code=$(curl -s -o /tmp/api_unauth.json -w '%{http_code}' http://127.0.0.1:3001/api/argocd/applications)
          test "${code}" = "401"
          # API with bearer token → 200
          code=$(curl -s -o /tmp/api_auth.json -w '%{http_code}' \
            -H "Authorization: Bearer ${UI_API_TOKEN}" \
            http://127.0.0.1:3001/api/argocd/applications)
          test "${code}" = "200"
          echo "E2E UI backend checks passed"

      - name: Debug ArgoCD deployed apps
        if: always()
        run: |
          echo "Deployments in argocd-demo:"
          kubectl get deployments -n argocd-demo || true
          echo "Deployments in flux-demo:"
          kubectl get deployments -n flux-demo || true
          echo "Argo CD applications:"
          kubectl get applications -A || true
          echo "Flux kustomizations:"
          kubectl get kustomizations -A || true

      - name: Simulate ArgoCD Deployment Issues
        run: |
          kubectl get deployment nginx-app -n argocd-demo
          kubectl delete deployment nginx-app -n argocd-demo --wait=true --timeout=60s
          # kubectl wait fails if the object is missing; poll until Argo recreates it
          for i in $(seq 1 60); do
            if kubectl get deployment nginx-app -n argocd-demo >/dev/null 2>&1; then
              if kubectl wait --for=condition=available deployment/nginx-app -n argocd-demo --timeout=30s; then
                echo "Argo CD restored deployment"
                exit 0
              fi
            fi
            sleep 5
          done
          echo "Argo CD did not restore deployment in time"
          kubectl get application nginx-app -n argocd -o yaml || true
          exit 1

      - name: Simulate Flux Deployment Issues
        run: |
          kubectl get deployment nginx-app -n flux-demo
          kubectl scale deployment nginx-app --replicas=0 -n flux-demo
          for i in $(seq 1 60); do
            cur=$(kubectl get deployment nginx-app -n flux-demo -o jsonpath='{.spec.replicas}' 2>/dev/null || echo 0)
            ready=$(kubectl get deployment nginx-app -n flux-demo -o jsonpath='{.status.readyReplicas}' 2>/dev/null || echo 0)
            if [ "$cur" = "1" ] && [ "$ready" = "1" ]; then
              echo "Flux restored deployment"
              exit 0
            fi
            sleep 5
          done
          echo "Flux did not restore deployment in time"
          kubectl get kustomization flux-nginx-app -n flux-system -o yaml || true
          exit 1

      - name: Get Access Information
        id: access_info
        run: |
          if kubectl get secret argocd-initial-admin-secret -n argocd &>/dev/null; then
            ARGOCD_PASSWORD=$(kubectl -n argocd get secret argocd-initial-admin-secret -o jsonpath="{.data.password}" | base64 -d)
            echo "::add-mask::${ARGOCD_PASSWORD}"
            printf '%s' "${ARGOCD_PASSWORD}" > /tmp/argocd_admin_password
          else
            echo "::add-mask::admin"
            printf '%s' "admin" > /tmp/argocd_admin_password
          fi
          echo "Argo CD admin password written to /tmp/argocd_admin_password (masked; not echoed)"

      - name: Output Access Information
        run: |
          echo ========================================
          echo "           Access Information           "
          echo ========================================
          echo
          echo "To access UI Dashboard:"
          echo "1. Run 'kubectl port-forward service/ui-frontend 8082:80 -n default'"
          echo "2. Open http://localhost:8082"
          echo
          echo "To access ArgoCD UI:"
          echo "1. Run 'kubectl port-forward svc/argocd-server -n argocd 8080:80'"
          echo "2. Open http://localhost:8080"
          echo "3. Login with username: admin"
          echo "   Password: (see /tmp/argocd_admin_password on the runner; value is masked)"

      - name: Persist benchmark results
        if: always()
        run: |
          python3 .github/scripts/write_demo_results.py
          test -f docs/results.md
          cat docs/results.md

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gitops-benchmark-results
          path: |
            docs/results.md
            docs/results.json
            docs/bench-raw/**
          if-no-files-found: error

      - name: Cleanup temporary bench branches
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BENCH_GIT_BRANCH: ci/bench-${{ github.run_id }}
        run: |
          chmod +x .github/scripts/bench-local-git.sh
          bash .github/scripts/bench-local-git.sh cleanup
          # Extra sweep for legacy ci-bench/* only (never mass-delete ci/bench-* of other runs)
          for ref in $(git ls-remote --heads origin 'ci-bench/*' | awk '{print $2}'); do
            branch=${ref#refs/heads/}
            echo "Deleting leftover ${branch}"
            git push origin --delete "${branch}" || true
          done

