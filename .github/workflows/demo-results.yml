name: Demo results

on:
  workflow_dispatch:
  schedule:
    - cron: "57 5 * * 1"
  pull_request:
    paths:
      - ".github/workflows/demo-results.yml"
      - ".github/scripts/run-benchmark-demo.sh"
      - ".github/scripts/benchmark-gitops.sh"
      - ".github/scripts/bench-local-git.sh"
      - ".github/scripts/write_demo_results.py"
      - "apps/**"
      - "modules/**"
      - "main.tf"
      - "variables.tf"

jobs:
  gitops-benchmark:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      checks: read
    env:
      TF_VAR_git_repository_url: https://github.com/justrunme/gitops-duel-argocd-vs-flux.git
      TF_VAR_git_branch: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
      TF_VAR_argocd_target_namespace: argocd-demo
      TF_VAR_flux_target_namespace: flux-demo
      ARGO_TARGET_NAMESPACE: argocd-demo
      FLUX_TARGET_NAMESPACE: flux-demo
      BENCHMARK_SAMPLES: "3"
      BENCHMARK_PROFILES: "equal-10s,defaults"
      BENCH_GIT_BRANCH: ci/bench-${{ github.run_id }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Setup KinD
        uses: helm/kind-action@v1.15.1
        with:
          cluster_name: kind
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false
      - name: Install CLIs and recorders
        run: |
          curl -s https://fluxcd.io/install.sh | sudo bash
          curl -sSL -o argocd https://github.com/argoproj/argo-cd/releases/download/v3.1.8/argocd-linux-amd64
          chmod +x argocd && sudo mv argocd /usr/local/bin/
          python -m pip install asciinema
          npm install -g svg-term-cli
      - name: Show GitOps source revision
        run: |
          echo "Tracking repo=${TF_VAR_git_repository_url} branch=${TF_VAR_git_branch}"
      - name: Preload Argo CD images into kind
        env:
          ARGOCD_CHART_VERSION: "9.0.0"
        run: bash .github/scripts/preload-kind-images.sh

      - name: Terraform apply core
        run: |
          terraform init
          terraform apply -target=module.argocd.kubernetes_namespace.argocd -auto-approve
          terraform apply -target=module.argocd.helm_release.argocd -auto-approve
          kubectl wait --for=condition=Established crd/applications.argoproj.io --timeout=120s
          terraform apply -target=module.argocd.kubernetes_namespace.target -auto-approve
          terraform apply -target=module.argocd.kubernetes_manifest.argocd_nginx_app -auto-approve
          terraform apply -target=module.argocd.kubernetes_manifest.argocd_helm_nginx_app -auto-approve
          terraform apply -auto-approve
          kubectl wait --for=condition=Available deployment/argocd-server -n argocd --timeout=360s
          kubectl wait --for=condition=ready pod -l app=source-controller -n flux-system --timeout=300s
      - name: Argo CD diagnostics
        if: failure()
        run: bash .github/scripts/argocd-diagnostics.sh
      - name: Record benchmarks
        run: |
          mkdir -p docs/assets
          chmod +x .github/scripts/run-benchmark-demo.sh .github/scripts/benchmark-gitops.sh .github/scripts/bench-local-git.sh
          asciinema rec --overwrite -c 'bash .github/scripts/run-benchmark-demo.sh' docs/assets/gitops-duel.cast
          svg-term --in docs/assets/gitops-duel.cast --out docs/assets/gitops-duel.svg --window --width 100 --height 24 --no-cursor
          python3 .github/scripts/write_demo_results.py
          cat docs/results.md
          cat docs/results.json
          python3 - <<'PY'
          import json, re, sys
          data = json.load(open("docs/results.json"))
          ok = True
          num = re.compile(r"\d+(?:\.\d+)?")
          profiles = data.get("profiles") or {}
          if "equal-10s" not in profiles or "defaults" not in profiles:
              print(f"INVALID profiles={list(profiles)}", file=sys.stderr)
              ok = False
          if int(data.get("samples_per_metric", 0)) < 3:
              print("INVALID samples_per_metric < 3", file=sys.stderr)
              ok = False
          required = [
              "time_to_ready_seconds",
              "time_to_self_heal_seconds",
              "time_to_deletion_recovery_seconds",
              "time_to_commit_ready_seconds",
          ]
          for profile, pdata in profiles.items():
              for tool, metrics in pdata.get("metrics", {}).items():
                  for key in required:
                      block = metrics.get(key)
                      if not isinstance(block, dict):
                          print(f"INVALID missing {profile}/{tool}/{key}", file=sys.stderr)
                          ok = False
                          continue
                      for field in ("median", "min", "max"):
                          s = str(block.get(field, "")).strip()
                          if not num.fullmatch(s):
                              print(f"INVALID {profile}/{tool}/{key}.{field}={s!r}", file=sys.stderr)
                              ok = False
                          elif key in ("time_to_ready_seconds", "time_to_commit_ready_seconds") and float(s) <= 0:
                              print(f"INVALID {profile}/{tool}/{key}.{field}={s!r} (must be > 0)", file=sys.stderr)
                              ok = False
                      if len(block.get("samples") or []) < 3:
                          print(f"INVALID N<3 {profile}/{tool}/{key}", file=sys.stderr)
                          ok = False
          sys.exit(0 if ok else 1)
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: demo-results
          path: |
            docs/results.md
            docs/results.json
            docs/bench-raw/**
            docs/assets/gitops-duel.cast
            docs/assets/gitops-duel.svg
          if-no-files-found: error
      - name: Cleanup temporary bench branches
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BENCH_GIT_BRANCH: ci/bench-${{ github.run_id }}
        run: |
          chmod +x .github/scripts/bench-local-git.sh
          bash .github/scripts/bench-local-git.sh cleanup
          for ref in $(git ls-remote --heads origin 'ci-bench/*' 'ci/bench-*' | awk '{print $2}'); do
            branch=${ref#refs/heads/}
            echo "Deleting leftover ${branch}"
            git push origin --delete "${branch}" || true
          done

